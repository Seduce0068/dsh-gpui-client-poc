# 個人リポジトリ共通の再利用可能ワークフローへ委譲する。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      apt_packages: |
        libxcb1-dev
        libxkbcommon-dev
        libxkbcommon-x11-dev
